<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Голубь Visuals — Neon Glass</title>
    <style>
        /* ——————————————————— ГЛОБАЛЬНЫЕ ——————————————————— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        /* неоновый фон — движущиеся градиенты */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 20% 30%, rgba(239, 68, 68, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
            animation: bgMove 18s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes bgMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(4%, 6%) scale(1.1); }
        }

        /* ——————————————————— СТЕКЛЯННАЯ КАРТОЧКА ——————————————————— */
        .glass {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
            background: rgba(12, 12, 20, 0.55);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border-radius: 48px;
            padding: 2.2rem 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 30px 80px -20px rgba(0, 0, 0, 0.8),
                inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }
        /* неоновое свечение по краям (релятивистский эффект) */
        .glass::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50px;
            padding: 2px;
            background: conic-gradient(from 0deg, #ef4444, #a855f7, #3b82f6, #ef4444);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.25;
            animation: neonSpin 8s linear infinite;
            pointer-events: none;
        }
        @keyframes neonSpin {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* ——————————————————— СПИННЕР (красный с крутилкой) ——————————————————— */
        .spinner-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.6rem;
            width: 80px;
            height: 80px;
            position: relative;
        }
        .spinner {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top: 4px solid #ef4444;
            border-right: 4px solid #ef4444;
            animation: spin 0.85s cubic-bezier(0.6, 0.0, 0.4, 1.0) infinite;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.2);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-glow {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, transparent 70%);
            filter: blur(16px);
            animation: pulseGlow 2.2s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* ——————————————————— АНИМАЦИИ ПОЯВЛЕНИЯ ——————————————————— */
        .fade-up {
            opacity: 0;
            transform: translateY(28px) scale(0.98);
            filter: blur(6px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 1s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        /* ——————————————————— МЕНЮ (НЕОНОВЫЕ КНОПКИ) ——————————————————— */
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 1.5rem;
        }
        @media (max-width: 500px) {
            .game-grid { grid-template-columns: 1fr; }
            .glass { padding: 1.6rem 1.2rem; }
        }

        .btn-neon {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            font-weight: 600;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            justify-content: center;
            font-size: 1rem;
            backdrop-filter: blur(4px);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
        .btn-neon:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 40px -12px rgba(239, 68, 68, 0.3), 0 0 30px rgba(239, 68, 68, 0.05);
        }
        .btn-neon:active { transform: scale(0.96); }

        /* ——————————————————— ДИАЛОГ ПОДТВЕРЖДЕНИЯ ——————————————————— */
        .confirm-box {
            margin-top: 1.2rem;
            padding: 1.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .confirm-box p { color: rgba(255, 255, 255, 0.7); font-size: 0.95rem; }
        .btn-confirm-yes {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            transition: 0.2s;
            cursor: pointer;
        }
        .btn-confirm-yes:hover { background: rgba(239, 68, 68, 0.35); color: #fff; }
        .btn-confirm-no {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 8px 20px;
            border-radius: 40px;
            transition: 0.2s;
            cursor: pointer;
        }
        .btn-confirm-no:hover { background: rgba(255,255,255,0.08); color: #fff; }

        /* ——————————————————— ИГРОВОЙ КОНТЕЙНЕР ——————————————————— */
        .game-container {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: 28px;
            padding: 1rem;
            border: 1px solid rgba(255,255,255,0.04);
            display: none;
            animation: menuAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .game-container.active { display: block; }
        @keyframes menuAppear {
            0% { opacity: 0; transform: scale(0.96) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        canvas { display: block; margin: 0 auto; max-width: 100%; border-radius: 16px; background: #0a0a12; }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        .btn-back {
            background: rgba(255,255,255,0.04);
            border: none;
            color: rgba(255,255,255,0.3);
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .btn-back:hover { background: rgba(255,255,255,0.08); color: #fff; }

        /* ——————————————————— СТАТУС-БАР ПРОГРЕССА (ЗАГРУЗКА) ——————————————————— */
        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0 0.5rem;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #a855f7);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        /* ——————————————————— СКРЫТЫЕ СОСТОЯНИЯ ——————————————————— */
        .hidden { display: none !important; }

        /* ——————————————————— МЕТА ——————————————————— */
        .meta {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.03);
            text-align: center;
            color: rgba(255,255,255,0.15);
            font-size: 0.75rem;
            letter-spacing: 0.3px;
        }
        .meta span { color: rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

<div class="glass" id="app">

    <!-- ========== ЭКРАН ЗАГРУЗКИ ========== -->
    <div id="loader">
        <div class="spinner-wrap">
            <div class="spinner-glow"></div>
            <div class="spinner"></div>
        </div>
        <div class="text-center fade-up visible">
            <div style="font-size:2.4rem; font-weight:800; letter-spacing:-0.02em; background:linear-gradient(135deg,#fca5a5,#ef4444,#b91c1c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Голубь Visuals</div>
            <p class="text-white/30 text-sm tracking-wide mt-1">загрузка...</p>
            <div class="progress-track mt-3"><div class="progress-fill" id="loadProgress"></div></div>
            <p class="text-white/15 text-xs mt-2" id="loadTip">настраиваем неоновую магию</p>
        </div>
    </div>

    <!-- ========== ОСНОВНОЙ ИНТЕРФЕЙС ========== -->
    <div id="mainScreen" class="hidden">
        <!-- шапка -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <span style="font-size:1.8rem;">🕊️</span>
                <span style="color:rgba(255,255,255,0.8); font-weight:600; font-size:1.2rem;">Голубь</span>
            </div>
            <span style="color:rgba(255,255,255,0.12); font-size:0.7rem; background:rgba(255,255,255,0.03); padding:4px 14px; border-radius:40px;">v3.0</span>
        </div>

        <!-- приветствие -->
        <div class="fade-up visible" style="transition-delay:0.05s;">
            <h2 style="color:rgba(255,255,255,0.7); font-size:1.3rem; font-weight:500;">🐦 Выбери игру</h2>
            <p style="color:rgba(255,255,255,0.2); font-size:0.85rem; margin-top:2px;">кликни — и голубь покажет путь</p>
        </div>

        <!-- сетка кнопок -->
        <div class="game-grid fade-up visible" style="transition-delay:0.12s;">
            <button class="btn-neon" data-game="clicker">🖱️ Голубь-кликер</button>
            <button class="btn-neon" data-game="snake">🐍 Голубь-змейка</button>
            <button class="btn-neon" data-game="fly">🕊️ Полет голубя</button>
            <button class="btn-neon" data-game="memory">🧠 Голубиная память</button>
        </div>

        <!-- диалог подтверждения -->
        <div id="confirmBox" class="confirm-box hidden">
            <p id="confirmText">❓ Действительно хотите поиграть?</p>
            <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
                <button class="btn-confirm-yes" id="confirmYes">✅ Да</button>
                <button class="btn-confirm-no" id="confirmNo">❌ Нет</button>
                <span style="color:rgba(255,255,255,0.15); font-size:0.8rem; align-self:center;">автовыбор через <span id="countdownDisplay">10</span>с</span>
            </div>
        </div>

        <!-- контейнер для игры -->
        <div id="gameContainer" class="game-container">
            <div class="game-header">
                <span id="gameTitle">Игра</span>
                <button class="btn-back" id="closeGame">✕ закрыть</button>
            </div>
            <div id="gameCanvasWrapper"></div>
        </div>

        <!-- мета -->
        <div class="meta">
            <span>🕊️</span> голубиный релятивизм · <span>неон</span> · 0% читов
        </div>
    </div>
</div>

<script>
    // ————————————————————————————————————————————————————
    // 1. ЗАГРУЗКА (симуляция)
    // ————————————————————————————————————————————————————
    let loadProgress = 0;
    const loadBar = document.getElementById('loadProgress');
    const loadTip = document.getElementById('loadTip');
    const tips = ['перья калибруются...', 'клюв настраивается...', 'крылья синхронизируются...', 'неон активирован ✅'];

    function simulateLoad() {
        if (loadProgress >= 100) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            // триггерим видимость fade-up
            document.querySelectorAll('#mainScreen .fade-up').forEach(el => el.classList.add('visible'));
            return;
        }
        loadProgress += Math.random() * 14 + 4;
        if (loadProgress > 100) loadProgress = 100;
        loadBar.style.width = loadProgress + '%';
        const idx = Math.min(Math.floor(loadProgress / 25), tips.length - 1);
        loadTip.textContent = tips[idx];
        setTimeout(simulateLoad, 160 + Math.random() * 180);
    }
    window.addEventListener('load', () => setTimeout(simulateLoad, 300));

    // ————————————————————————————————————————————————————
    // 2. ЛОГИКА МЕНЮ И ИГР
    // ————————————————————————————————————————————————————
    let selectedGame = null;
    let countdown = 10;
    let confirmTimer = null;

    const confirmBox = document.getElementById('confirmBox');
    const confirmText = document.getElementById('confirmText');
    const countdownSpan = document.getElementById('countdownDisplay');
    const gameContainer = document.getElementById('gameContainer');
    const gameTitle = document.getElementById('gameTitle');
    const canvasWrapper = document.getElementById('gameCanvasWrapper');

    // словари
    const gameNames = {
        clicker: '🖱️ Голубь-кликер',
        snake: '🐍 Голубь-змейка',
        fly: '🕊️ Полет голубя',
        memory: '🧠 Голубиная память'
    };

    // обработчики кнопок меню
    document.querySelectorAll('.btn-neon').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const game = this.dataset.game;
            launchGame(game);
        });
    });

    function launchGame(gameId) {
        if (confirmTimer) clearInterval(confirmTimer);
        selectedGame = gameId;
        confirmText.textContent = `❓ Действительно хотите поиграть в «${gameNames[gameId]}»?`;
        confirmBox.classList.remove('hidden');
        // анимация появления
        confirmBox.style.animation = 'none';
        void confirmBox.offsetHeight;
        confirmBox.style.animation = 'menuAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards';

        // скрыть предыдущую игру
        gameContainer.classList.remove('active');
        canvasWrapper.innerHTML = '';

        countdown = 10;
        countdownSpan.textContent = countdown;
        confirmTimer = setInterval(() => {
            countdown--;
            countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(confirmTimer);
                confirmTimer = null;
                confirmGame(true);
            }
        }, 1000);
    }

    document.getElementById('confirmYes').addEventListener('click', () => { confirmGame(true); });
    document.getElementById('confirmNo').addEventListener('click', () => { confirmGame(false); });

    function confirmGame(choice) {
        if (confirmTimer) { clearInterval(confirmTimer); confirmTimer = null; }
        confirmBox.classList.add('hidden');
        if (!choice) return;

        // запускаем игру
        gameContainer.classList.add('active');
        gameTitle.textContent = gameNames[selectedGame] || 'Игра';
        canvasWrapper.innerHTML = ''; // очищаем

        // создаём canvas и запускаем конкретную игру
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = 400;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvasWrapper.appendChild(canvas);

        switch (selectedGame) {
            case 'clicker': initClicker(canvas); break;
            case 'snake':   initSnake(canvas); break;
            case 'fly':     initFly(canvas); break;
            case 'memory':  initMemory(canvas); break;
            default: break;
        }
    }

    document.getElementById('closeGame').addEventListener('click', () => {
        gameContainer.classList.remove('active');
        canvasWrapper.innerHTML = '';
    });

    // ————————————————————————————————————————————————————
    // 3. ИГРЫ (полноценные, рабочие)
    // ————————————————————————————————————————————————————

    // ---------- КЛИКЕР ----------
    function initClicker(canvas) {
        const ctx = canvas.getContext('2d');
        let score = 0;
        let clicks = 0;
        const pigeon = { x: 200, y: 150, w: 80, h: 80 };
        let animId = null;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // фон
            const grad = ctx.createRadialGradient(300, 200, 20, 300, 200, 300);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#0a0a12');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // голубь (круг с крыльями)
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath();
            ctx.arc(pigeon.x, pigeon.y, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ef4444';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🕊️', pigeon.x, pigeon.y - 4);

            // счёт
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '24px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`🐦 ${score}`, 20, 50);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '14px sans-serif';
            ctx.fillText(`кликов: ${clicks}`, 20, 80);
        }

        function handleClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            const dx = mx - pigeon.x, dy = my - pigeon.y;
            if (dx * dx + dy * dy < 40 * 40) {
                score++;
                clicks++;
                // анимация подпрыгивания
                pigeon.y -= 6;
                setTimeout(() => { pigeon.y += 6; }, 80);
                draw();
            }
        }

        canvas.addEventListener('click', handleClick);
        draw();
        // анимация пульсации
        let phase = 0;
        function pulse() {
            phase += 0.03;
            const scale = 1 + 0.04 * Math.sin(phase);
            // просто перерисовка с изменением размера (для красоты)
            // но мы не меняем реальный радиус, чтобы хитбокс не смещался
            draw();
            requestAnimationFrame(pulse);
        }
        pulse();
    }

    // ---------- ЗМЕЙКА ----------
    function initSnake(canvas) {
        const ctx = canvas.getContext('2d');
        const size = 20;
        let snake = [{x: 10, y: 10}];
        let dir = {x: 1, y: 0};
        let food = {x: 15, y: 10};
        let score = 0;
        let gameOver = false;
        let interval = null;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / size)),
                y: Math.floor(Math.random() * (canvas.height / size))
            };
            // не попадать в змею
            while (snake.some(s => s.x === food.x && s.y === food.y)) {
                food.x = Math.floor(Math.random() * (canvas.width / size));
                food.y = Math.floor(Math.random() * (canvas.height / size));
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // фон
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // еда (зерно)
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(food.x * size + size/2, food.y * size + size/2, size/2 - 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // змея
            snake.forEach((s, i) => {
                const gradient = ctx.createRadialGradient(
                    s.x*size + size/2, s.y*size + size/2, 2,
                    s.x*size + size/2, s.y*size + size/2, size/2
                );
                gradient.addColorStop(0, i === 0 ? '#ef4444' : '#fca5a5');
                gradient.addColorStop(1, i === 0 ? '#b91c1c' : '#ef4444');
                ctx.fillStyle = gradient;
                ctx.shadowColor = i === 0 ? '#ef4444' : 'transparent';
                ctx.shadowBlur = i === 0 ? 20 : 0;
                ctx.beginPath();
                ctx.roundRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2, 6);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // счёт
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '18px monospace';
            ctx.fillText(`🍎 ${score}`, 10, 30);
            if (gameOver) {
                ctx.fillStyle = 'rgba(239,68,68,0.8)';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('💀 Игра окончена', canvas.width/2, canvas.height/2 - 20);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillText('кликните, чтобы начать заново', canvas.width/2, canvas.height/2 + 30);
            }
        }

        function step() {
            if (gameOver) return;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            // стены
            if (head.x < 0 || head.x >= canvas.width/size || head.y < 0 || head.y >= canvas.height/size) {
                gameOver = true;
                if (interval) clearInterval(interval);
                draw();
                return;
            }
            // столкновение с собой
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver = true;
                if (interval) clearInterval(interval);
                draw();
                return;
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                randomFood();
            } else {
                snake.pop();
            }
            draw();
        }

        // управление
        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            if (gameOver) return;
            const key = e.key;
            if (key === 'ArrowUp' && dir.y !== 1) dir = {x:0, y:-1};
            else if (key === 'ArrowDown' && dir.y !== -1) dir = {x:0, y:1};
            else if (key === 'ArrowLeft' && dir.x !== 1) dir = {x:-1, y:0};
            else if (key === 'ArrowRight' && dir.x !== -1) dir = {x:1, y:0};
        });

        // клик для перезапуска
        canvas.addEventListener('click', () => {
            if (gameOver) {
                snake = [{x: 10, y: 10}];
                dir = {x: 1, y: 0};
                score = 0;
                gameOver = false;
                randomFood();
                if (interval) clearInterval(interval);
                interval = setInterval(step, 150);
                draw();
            }
        });

        // инициализация
        randomFood();
        draw();
        interval = setInterval(step, 150);
    }

    // ---------- ПОЛЕТ ГОЛУБЯ ----------
    function initFly(canvas) {
        const ctx = canvas.getContext('2d');
        let pigeon = {x: 300, y: 200, r: 20};
        let coins = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        for (let i = 0; i < 5; i++) {
            coins.push({x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 10, collected: false});
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // монеты
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
                    ctx.fill();
                }
            });
            ctx.shadowBlur = 0;

            // голубь
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath();
            ctx.arc(pigeon.x, pigeon.y, pigeon.r, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ef4444';
            ctx.font = '32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🕊️', pigeon.x, pigeon.y - 2);

            // счёт
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '18px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`🪙 ${score}`, 10, 30);

            if (gameOver) {
                ctx.fillStyle = 'rgba(239,68,68,0.8)';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('💥 Сбит!', canvas.width/2, canvas.height/2 - 20);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillText('кликните, чтобы рестарт', canvas.width/2, canvas.height/2 + 30);
            }
        }

        function update() {
            if (gameOver) return;
            let dx = 0, dy = 0;
            if (keys['ArrowUp']) dy = -3;
            if (keys['ArrowDown']) dy = 3;
            if (keys['ArrowLeft']) dx = -3;
            if (keys['ArrowRight']) dx = 3;
            // нормализация
            if (dx && dy) { dx *= 0.707; dy *= 0.707; }
            pigeon.x = Math.min(canvas.width - pigeon.r, Math.max(pigeon.r, pigeon.x + dx));
            pigeon.y = Math.min(canvas.height - pigeon.r, Math.max(pigeon.r, pigeon.y + dy));

            // сбор монет
            coins.forEach(c => {
                if (!c.collected) {
                    const d = Math.hypot(pigeon.x - c.x, pigeon.y - c.y);
                    if (d < pigeon.r + c.r) {
                        c.collected = true;
                        score++;
                        // новая монета
                        setTimeout(() => {
                            c.collected = false;
                            c.x = Math.random() * canvas.width;
                            c.y = Math.random() * canvas.height;
                        }, 500);
                    }
                }
            });

            // проверка на вылет за край (game over)
            if (pigeon.x - pigeon.r < 0 || pigeon.x + pigeon.r > canvas.width ||
                pigeon.y - pigeon.r < 0 || pigeon.y + pigeon.r > canvas.height) {
                gameOver = true;
            }
            draw();
            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', (e) => { keys[e.key] = true; e.preventDefault(); });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; e.preventDefault(); });

        canvas.addEventListener('click', () => {
            if (gameOver) {
                pigeon.x = 300; pigeon.y = 200;
                coins.forEach(c => c.collected = false);
                score = 0;
                gameOver = false;
                draw();
            }
        });

        update();
    }

    // ---------- ПАМЯТЬ (мемори) ----------
    function initMemory(canvas) {
        const ctx = canvas.getContext('2d');
        const pairs = ['🕊️', '🐦', '🪹', '🌾', '🐣'];
        let cards = [];
        let flipped = [];
        let matched = [];
        let lock = false;
        let moves = 0;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function init() {
            const deck = [...pairs, ...pairs];
            cards = shuffle(deck).map((emoji, idx) => ({ id: idx, emoji, matched: false, flipped: false }));
            flipped = [];
            matched = [];
            moves = 0;
            lock = false;
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cols = 5, rows = 2;
            const w = 80, h = 90;
            const startX = (canvas.width - cols * w) / 2;
            const startY = (canvas.height - rows * h) / 2;

            cards.forEach((card, idx) => {
                const x = startX + (idx % cols) * w;
                const y = startY + Math.floor(idx / cols) * h;
                // карточка
                ctx.shadowBlur = 0;
                if (card.matched || card.flipped) {
                    ctx.fillStyle = 'rgba(239,68,68,0.15)';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 20;
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.shadowBlur = 0;
                }
                ctx.beginPath();
                ctx.roundRect(x, y, w-4, h-4, 12);
                ctx.fill();

                ctx.shadowBlur = 0;
                if (card.matched || card.flipped) {
                    ctx.font = '36px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(card.emoji, x + w/2, y + h/2);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.font = '28px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('❓', x + w/2, y + h/2);
                }
            });

            // статистика
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '14px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`ходов: ${moves}`, 10, 25);
        }

        function handleClick(e) {
            if (lock) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            const cols = 5, rows = 2;
            const w = 80, h = 90;
            const startX = (canvas.width - cols * w) / 2;
            const startY = (canvas.height - rows * h) / 2;

            for (let i = 0; i < cards.length; i++) {
                const x = startX + (i % cols) * w;
                const y = startY + Math.floor(i / cols) * h;
                if (mx >= x && mx <= x+w && my >= y && my <= y+h) {
                    const card = cards[i];
                    if (card.matched || card.flipped) continue;
                    // переворачиваем
                    card.flipped = true;
                    flipped.push(i);
                    moves++;
                    draw();

                    if (flipped.length === 2) {
                        lock = true;
                        const idx1 = flipped[0], idx2 = flipped[1];
                        if (cards[idx1].emoji === cards[idx2].emoji) {
                            cards[idx1].matched = true;
                            cards[idx2].matched = true;
                            flipped = [];
                            lock = false;
                            // проверка победы
                            if (cards.every(c => c.matched)) {
                                setTimeout(() => {
                                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    ctx.fillStyle = '#fff';
                                    ctx.font = 'bold 30px sans-serif';
                                    ctx.textAlign = 'center';
                                    ctx.fillText('🎉 Победа!', canvas.width/2, canvas.height/2);
                                }, 300);
                            }
                            draw();
                        } else {
                            setTimeout(() => {
                                cards[idx1].flipped = false;
                                cards[idx2].flipped = false;
                                flipped = [];
                                lock = false;
                                draw();
                            }, 600);
                        }
                    }
                    return;
                }
            }
        }

        canvas.addEventListener('click', handleClick);
        init();
    }

    // для roundRect
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2*r) r = w/2;
        if (h < 2*r) r = h/2;
        this.moveTo(x+r, y);
        this.lineTo(x+w-r, y);
        this.quadraticCurveTo(x+w, y, x+w, y+r);
        this.lineTo(x+w, y+h-r);
        this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
        this.lineTo(x+r, y+h);
        this.quadraticCurveTo(x, y+h, x, y+h-r);
        this.lineTo(x, y+r);
        this.quadraticCurveTo(x, y, x+r, y);
        return this;
    };
</script>
