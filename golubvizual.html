<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Голубь Visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ----- общие ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020203;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* затемнение фона как на plintusvisuals */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 40%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(56, 189, 248, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        /* карточка */
        .glass {
            position: relative;
            z-index: 1;
            background: rgba(8, 8, 9, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2.5rem;
            padding: 2.5rem 2.5rem 2rem;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s ease;
        }
        /* спиннер — красный с крутилкой */
        .spinner-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.8rem;
            width: 72px;
            height: 72px;
            position: relative;
        }
        .spinner {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid #ef4444;
            border-right: 4px solid #ef4444;
            animation: spin 0.9s cubic-bezier(0.6, 0.0, 0.4, 1.0) infinite;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* тень под спиннером как релятивистский эффект */
        .spinner-glow {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, transparent 70%);
            filter: blur(12px);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.04); }
        }

        /* анимация появления (fade-up) как на оригинале */
        .fade-up {
            opacity: 0;
            transform: translateY(24px);
            filter: blur(8px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 1s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* кнопки */
        .btn-pigeon {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            transition: all 0.25s ease;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            font-size: 1rem;
            backdrop-filter: blur(4px);
        }
        .btn-pigeon:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -8px rgba(239, 68, 68, 0.25);
        }
        .btn-pigeon:active { transform: scale(0.97); }

        /* сетка игр */
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        @media (max-width: 480px) {
            .game-grid { grid-template-columns: 1fr; }
            .glass { padding: 1.8rem 1.2rem; }
        }

        /* заголовок */
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fca5a5 0%, #ef4444 60%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* подпись */
        .meta {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.5rem;
            margin-top: 1.8rem;
            text-align: center;
        }
        .meta span { color: rgba(239, 68, 68, 0.6); }

        /* скрытые состояния */
        .hidden-state {
            display: none;
        }

        /* меню релятивистское — плавное появление */
        .menu-appear {
            animation: menuFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes menuFade {
            0% { opacity: 0; transform: scale(0.97) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<div class="glass" id="app">
    <!-- ===== ЭКРАН ЗАГРУЗКИ (спиннер + надпись) ===== -->
    <div id="loaderScreen">
        <div class="spinner-wrap">
            <div class="spinner-glow"></div>
            <div class="spinner"></div>
        </div>
        <div class="text-center fade-up visible">
            <div class="title text-3xl mb-1">Голубь Visuals</div>
            <p class="text-white/40 text-sm tracking-wide">загрузка...</p>
            <div class="mt-4 w-24 h-0.5 bg-white/5 mx-auto rounded-full overflow-hidden">
                <div class="h-full w-0 bg-red-500/60 rounded-full" id="progressBar" style="width:0%;"></div>
            </div>
            <p class="text-white/20 text-xs mt-3" id="loadingTip">настраиваем голубиную магию</p>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС (скрыт до окончания загрузки) ===== -->
    <div id="mainScreen" class="hidden-state menu-appear">
        <!-- шапка -->
        <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🕊️</span>
                <span class="text-white/90 font-semibold text-lg tracking-tight">Голубь</span>
            </div>
            <span class="text-white/20 text-xs bg-white/5 px-3 py-1 rounded-full">v2.0</span>
        </div>

        <!-- приветствие -->
        <div class="fade-up visible" style="transition-delay:0.05s;">
            <h2 class="text-white/80 text-xl font-medium">🐦 Выбери игру</h2>
            <p class="text-white/30 text-sm mt-0.5">кликни — и голубь покажет путь</p>
        </div>

        <!-- сетка игр -->
        <div class="game-grid fade-up visible" style="transition-delay:0.15s;">
            <button class="btn-pigeon" onclick="launchGame('clicker')">
                <span>🖱️</span> Голубь-кликер
            </button>
            <button class="btn-pigeon" onclick="launchGame('snake')">
                <span>🐍</span> Голубь-змейка
            </button>
            <button class="btn-pigeon" onclick="launchGame('pigeon')">
                <span>🕊️</span> Полет голубя
            </button>
            <button class="btn-pigeon" onclick="launchGame('memory')">
                <span>🧠</span> Голубиная память
            </button>
        </div>

        <!-- диалог подтверждения (появляется при клике) -->
        <div id="confirmBox" class="mt-5 p-4 rounded-2xl bg-white/5 border border-white/10 hidden-state menu-appear">
            <p class="text-white/70 text-sm" id="confirmText">❓ Действительно хотите поиграть?</p>
            <div class="flex gap-3 mt-3">
                <button class="flex-1 py-2 rounded-full bg-red-500/20 text-red-300 text-sm font-medium hover:bg-red-500/30 transition" onclick="confirmGame(true)">✅ Да</button>
                <button class="flex-1 py-2 rounded-full bg-white/5 text-white/40 text-sm font-medium hover:bg-white/10 transition" onclick="confirmGame(false)">❌ Нет</button>
            </div>
            <p class="text-white/20 text-xs text-center mt-2">⏳ автовыбор через <span id="countdownTimer">10</span> сек</p>
        </div>

        <!-- вывод результата (запуск игры) -->
        <div id="gameResult" class="mt-4 text-center hidden-state">
            <div class="bg-white/5 rounded-2xl p-4 border border-white/5">
                <p class="text-white/80 text-sm" id="resultMessage">🕊️ Запускаем...</p>
                <div class="mt-3 w-full h-1 bg-white/5 rounded-full overflow-hidden">
                    <div class="h-full w-0 bg-gradient-to-r from-red-400 to-red-600 rounded-full" id="gameProgress" style="width:0%;"></div>
                </div>
                <button onclick="resetToMenu()" class="mt-4 text-white/30 text-xs hover:text-white/60 transition">← вернуться в меню</button>
            </div>
        </div>

        <!-- мета -->
        <div class="meta">
            <span>🕊️</span> голубиный релятивизм · <span>эстетика</span> · 0% читов
        </div>
    </div>
</div>

<script>
    // ----- симуляция загрузки (спиннер + прогресс) -----
    let progress = 0;
    const progressBar = document.getElementById('progressBar');
    const loadingTip = document.getElementById('loadingTip');
    const tips = [
        'перья настраиваются...',
        'клюв калибруется...',
        'крылья синхронизируются...',
        'голубиная магия активирована ✅'
    ];

    function simulateLoading() {
        if (progress >= 100) {
            // скрываем загрузку, показываем меню
            document.getElementById('loaderScreen').style.display = 'none';
            const main = document.getElementById('mainScreen');
            main.classList.remove('hidden-state');
            // принудительно запускаем fade-up для элементов
            document.querySelectorAll('#mainScreen .fade-up').forEach(el => {
                el.classList.add('visible');
            });
            return;
        }
        progress += Math.random() * 12 + 3;
        if (progress > 100) progress = 100;
        progressBar.style.width = progress + '%';
        // меняем подсказки
        const idx = Math.min(Math.floor(progress / 25), tips.length - 1);
        loadingTip.textContent = tips[idx];
        setTimeout(simulateLoading, 180 + Math.random() * 200);
    }

    // запускаем загрузку после рендера
    window.addEventListener('load', () => {
        setTimeout(simulateLoading, 400);
    });

    // ----- логика меню и игр -----
    let selectedGame = null;
    let confirmTimer = null;
    let countdown = 10;

    const confirmBox = document.getElementById('confirmBox');
    const confirmText = document.getElementById('confirmText');
    const countdownSpan = document.getElementById('countdownTimer');
    const gameResult = document.getElementById('gameResult');
    const resultMessage = document.getElementById('resultMessage');
    const gameProgress = document.getElementById('gameProgress');

    function launchGame(gameId) {
        // отменяем старый таймер
        if (confirmTimer) {
            clearInterval(confirmTimer);
            confirmTimer = null;
        }
        selectedGame = gameId;
        const names = {
            clicker: 'Голубь-кликер',
            snake: 'Голубь-змейка',
            pigeon: 'Полет голубя',
            memory: 'Голубиная память'
        };
        confirmText.textContent = `❓ Действительно хотите поиграть в «${names[gameId] || gameId}»?`;
        confirmBox.classList.remove('hidden-state');
        // анимация появления
        confirmBox.style.animation = 'none';
        void confirmBox.offsetHeight;
        confirmBox.style.animation = 'menuFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards';

        // скрываем предыдущий результат
        gameResult.classList.add('hidden-state');

        // запускаем обратный отсчёт
        countdown = 10;
        countdownSpan.textContent = countdown;
        confirmTimer = setInterval(() => {
            countdown -= 1;
            countdownSpan.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(confirmTimer);
                confirmTimer = null;
                confirmGame(true);
            }
        }, 1000);
    }

    function confirmGame(choice) {
        if (confirmTimer) {
            clearInterval(confirmTimer);
            confirmTimer = null;
        }
        confirmBox.classList.add('hidden-state');

        if (!choice) {
            // нет — просто закрываем
            return;
        }

        // ДА — запускаем игру
        const gameNames = {
            clicker: '🖱️ Голубь-кликер',
            snake: '🐍 Голубь-змейка',
            pigeon: '🕊️ Полет голубя',
            memory: '🧠 Голубиная память'
        };
        const messages = {
            clicker: 'Кликай по голубю! Счёт растёт.',
            snake: 'Собирай зёрна, не врезайся в стену.',
            pigeon: 'Управляй голубем, собирай монетки.',
            memory: 'Запоминай пары карт с голубями.'
        };
        resultMessage.textContent = `🎮 ${gameNames[selectedGame] || selectedGame}\n${messages[selectedGame] || 'Игра запущена.'}`;
        gameResult.classList.remove('hidden-state');
        gameResult.style.animation = 'none';
        void gameResult.offsetHeight;
        gameResult.style.animation = 'menuFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards';

        // прогресс-бар "запуска"
        let p = 0;
        const interval = setInterval(() => {
            p += Math.random() * 8 + 2;
            if (p >= 100) {
                p = 100;
                clearInterval(interval);
                resultMessage.textContent = `✅ ${gameNames[selectedGame] || selectedGame} запущена! 🕊️`;
                // небольшой эффект
                gameProgress.style.background = 'linear-gradient(90deg, #22c55e, #4ade80)';
            }
            gameProgress.style.width = p + '%';
        }, 150);
    }

    function resetToMenu() {
        gameResult.classList.add('hidden-state');
        gameProgress.style.width = '0%';
        gameProgress.style.background = 'linear-gradient(90deg, #ef4444, #f87171)';
        // также скрываем confirm если висит
        confirmBox.classList.add('hidden-state');
        if (confirmTimer) {
            clearInterval(confirmTimer);
            confirmTimer = null;
        }
    }

    // если пользователь кликнул вне диалога — можно закрыть, но мы не делаем
    // авто-закрытие по клику на фон — опустим для простоты
</script>

</body>
</html>
