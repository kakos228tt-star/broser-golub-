<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🕊️ Голубь-кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        /* неоновый фон */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background: radial-gradient(circle at 30% 40%, rgba(239,68,68,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(168,85,247,0.10) 0%, transparent 50%);
            animation: bgMove 16s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes bgMove {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(5%,8%) scale(1.1); }
        }

        .glass {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(12,12,20,0.6);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border-radius: 48px;
            padding: 2rem 1.8rem 1.8rem;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
            text-align: center;
        }

        /* неоновая обводка */
        .glass::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50px;
            padding: 2px;
            background: conic-gradient(from 0deg, #ef4444, #a855f7, #3b82f6, #ef4444);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.2;
            animation: neonSpin 8s linear infinite;
            pointer-events: none;
        }
        @keyframes neonSpin { to { filter: hue-rotate(360deg); } }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fca5a5, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.2rem;
        }
        .sub {
            color: rgba(255,255,255,0.25);
            font-size: 0.9rem;
            letter-spacing: 0.4px;
        }

        /* голубь (кликабельный) */
        .pigeon-wrap {
            perspective: 800px;
            margin: 1.5rem auto;
            width: 180px;
            height: 180px;
            cursor: pointer;
            position: relative;
        }
        .pigeon-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.15s ease;
            transform-style: preserve-3d;
            position: relative;
        }
        .pigeon-inner.flip {
            transform: rotateY(180deg);
        }
        .pigeon-front, .pigeon-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            background: radial-gradient(circle at 30% 30%, #1a1a2e, #0a0a12);
            border: 2px solid rgba(239,68,68,0.3);
            box-shadow: 0 0 40px rgba(239,68,68,0.15);
        }
        .pigeon-back {
            transform: rotateY(180deg);
            background: radial-gradient(circle at 70% 70%, #1a1a2e, #0a0a12);
            border-color: #fbbf24;
            box-shadow: 0 0 40px rgba(251,191,36,0.2);
            font-size: 4rem;
        }
        .pigeon-front span { display: block; }
        .pigeon-back span { display: block; }

        /* счётчики */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 1.2rem 0;
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            font-weight: 500;
        }
        .stats span {
            background: rgba(255,255,255,0.04);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stats .coins { color: #fbbf24; }
        .stats .clicks { color: #fca5a5; }

        /* кнопка авто-кликера */
        .btn-auto {
            background: rgba(239,68,68,0.10);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-auto:hover {
            background: rgba(239,68,68,0.2);
            border-color: #ef4444;
            color: #fff;
            box-shadow: 0 0 30px rgba(239,68,68,0.1);
        }
        .btn-auto.active {
            background: rgba(34,197,94,0.15);
            border-color: #22c55e;
            color: #4ade80;
        }
        .btn-auto.active:hover {
            background: rgba(34,197,94,0.25);
        }

        /* прогресс-бар "мозаика" */
        .mosaic-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0 0.5rem;
        }
        .mosaic-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #ef4444);
            border-radius: 10px;
            transition: width 0.2s ease;
        }
        .mosaic-label {
            color: rgba(255,255,255,0.15);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        /* сообщение о запуске */
        .launch-msg {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            animation: fadeMsg 1s ease;
        }
        @keyframes fadeMsg {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* адаптив */
        @media (max-width: 500px) {
            .glass { padding: 1.5rem 1rem; }
            .pigeon-wrap { width: 140px; height: 140px; }
            .pigeon-front, .pigeon-back { font-size: 4.5rem; }
            .stats { font-size: 0.9rem; flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<div class="glass">
    <h1>🕊️ Голубь-кликер</h1>
    <p class="sub">тапай по голубю, собирай монеты</p>

    <!-- голубь с 3D-переворотом -->
    <div class="pigeon-wrap" id="pigeonWrap">
        <div class="pigeon-inner" id="pigeonInner">
            <div class="pigeon-front"><span>🕊️</span></div>
            <div class="pigeon-back"><span>✨</span></div>
        </div>
    </div>

    <!-- статистика -->
    <div class="stats">
        <span class="coins">🪙 <span id="coinCount">0</span></span>
        <span class="clicks">👆 <span id="clickCount">0</span></span>
    </div>

    <!-- мозаика (прогресс до следующей монеты) -->
    <div class="mosaic-track">
        <div class="mosaic-fill" id="mosaicFill"></div>
    </div>
    <div class="mosaic-label">прогресс к следующей монете</div>

    <!-- кнопка авто-кликера -->
    <button class="btn-auto" id="autoBtn">🤖 Авто-клик (выкл.)</button>

    <!-- сообщение о запуске -->
    <div class="launch-msg" id="launchMsg">✅ Голубь-кликер успешно запущен</div>
</div>

<script>
    // ————————————————————————————————————————
    // 1. СОСТОЯНИЕ
    // ————————————————————————————————————————
    let coins = 0;
    let clicks = 0;
    let autoActive = false;
    let autoInterval = null;
    let clickPower = 1;          // монет за клик
    let progress = 0;           // 0..100 для мозаики
    const maxProgress = 20;     // сколько кликов до монеты

    // DOM
    const pigeonWrap = document.getElementById('pigeonWrap');
    const pigeonInner = document.getElementById('pigeonInner');
    const coinDisplay = document.getElementById('coinCount');
    const clickDisplay = document.getElementById('clickCount');
    const mosaicFill = document.getElementById('mosaicFill');
    const autoBtn = document.getElementById('autoBtn');
    const launchMsg = document.getElementById('launchMsg');

    // голосовой синтез
    function speak(text) {
        if (!window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.9;
        utterance.pitch = 1.2;
        utterance.volume = 0.6;
        window.speechSynthesis.cancel(); // убираем наложение
        window.speechSynthesis.speak(utterance);
    }

    // ————————————————————————————————————————
    // 2. ОСНОВНОЙ КЛИК
    // ————————————————————————————————————————
    function handleClick() {
        // анимация переворота
        pigeonInner.classList.add('flip');
        setTimeout(() => {
            pigeonInner.classList.remove('flip');
        }, 200);

        // увеличиваем счётчики
        clicks++;
        const earned = Math.floor(Math.random() * 3) + clickPower; // 1-3 монеты
        coins += earned;

        // прогресс мозаики (накапливаем клики)
        progress += 1;
        if (progress >= maxProgress) {
            // бонусная монета
            coins += 2;
            progress = 0;
            // звук "курлык!"
            speak('Курлык!');
            // эффект искр (визуально)
            document.querySelector('.pigeon-back span').textContent = '💥';
            setTimeout(() => {
                document.querySelector('.pigeon-back span').textContent = '✨';
            }, 300);
        }
        // обновление UI
        updateUI();

        // при каждом клике произносим "быстро" с вероятностью 10%
        if (Math.random() < 0.1) {
            speak('Быстро!');
        }
    }

    // ————————————————————————————————————————
    // 3. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
    // ————————————————————————————————————————
    function updateUI() {
        coinDisplay.textContent = coins;
        clickDisplay.textContent = clicks;
        const pct = (progress / maxProgress) * 100;
        mosaicFill.style.width = Math.min(pct, 100) + '%';
    }

    // ————————————————————————————————————————
    // 4. АВТО-КЛИКЕР
    // ————————————————————————————————————————
    function toggleAuto() {
        autoActive = !autoActive;
        if (autoActive) {
            autoInterval = setInterval(() => {
                handleClick();
            }, 300); // клик каждые 300 мс
            autoBtn.textContent = '🤖 Авто-клик (вкл.)';
            autoBtn.classList.add('active');
            speak('Авто-клик включён');
        } else {
            clearInterval(autoInterval);
            autoInterval = null;
            autoBtn.textContent = '🤖 Авто-клик (выкл.)';
            autoBtn.classList.remove('active');
            speak('Авто-клик выключен');
        }
    }

    // ————————————————————————————————————————
    // 5. СОБЫТИЯ
    // ————————————————————————————————————————
    pigeonWrap.addEventListener('click', handleClick);

    autoBtn.addEventListener('click', toggleAuto);

    // ————————————————————————————————————————
    // 6. СТАРТ
    // ————————————————————————————————————————
    // приветственное сообщение
    setTimeout(() => {
        launchMsg.textContent = '🕊️ Голубь-кликер запущен! Тапай!';
    }, 500);

    // голосовое приветствие
    setTimeout(() => {
        speak('Курлык! Начинаем!');
    }, 800);

    // маленький бонус: кликнуть автоматически при старте
    setTimeout(() => {
        handleClick(); // первый клик для активации
    }, 300);

    // инициализация UI
    updateUI();
</script>
</body>
</html>
