<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Game Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 255, 150, 0.08);
            border: 1px solid #2a2a2a;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: #00ff88;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: #0d0d0d;
        }

        .logo h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #00ff88;
        }

        .badge {
            background: #00ff88;
            color: #0d0d0d;
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        /* MENU / TABS */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .tab {
            background: #252525;
            color: #aaaaaa;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .tab:hover {
            background: #2f2f2f;
            color: #ffffff;
        }

        .tab.active {
            background: #00ff88;
            color: #0d0d0d;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
        }

        /* GAME GRID */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 10px;
        }

        .game-card {
            background: #202020;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2c2c2c;
            transition: 0.25s ease;
            cursor: default;
        }

        .game-card:hover {
            border-color: #00ff88;
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 255, 136, 0.06);
        }

        .game-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #2a2a2a;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #444;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .game-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .game-meta {
            color: #888;
            font-size: 13px;
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .game-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #00ff88;
            color: #0d0d0d;
            font-weight: 700;
            font-size: 15px;
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }

        .btn-download:hover {
            background: #00dd77;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }

        /* FOOTER */
        .footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            color: #555;
            font-size: 14px;
        }

        .footer a {
            color: #00ff88;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .search-box {
            background: #202020;
            border: 1px solid #2c2c2c;
            border-radius: 40px;
            padding: 10px 20px;
            color: #fff;
            width: 100%;
            max-width: 280px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .search-box:focus {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.05);
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .header { flex-direction: column; align-items: start; gap: 12px; }
            .logo h1 { font-size: 20px; }
            .badge { font-size: 11px; }
            .game-card { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🎮</div>
            <h1>Game<span>Hub</span></h1>
        </div>
        <div class="badge">🔥 9 игр доступно</div>
    </div>

    <!-- MENU / TABS (красивая менюшка) -->
    <div class="tabs">
        <button class="tab active" onclick="filterGames('all')">Все</button>
        <button class="tab" onclick="filterGames('rpg')">RPG</button>
        <button class="tab" onclick="filterGames('shooter')">Шутеры</button>
        <button class="tab" onclick="filterGames('simulator')">Симуляторы</button>
        <button class="tab" onclick="filterGames('horror')">Хорроры</button>
    </div>

    <!-- ПОИСК -->
    <input class="search-box" id="searchInput" placeholder="🔍 Поиск игры..." oninput="searchGames()">

    <!-- GRID -->
    <div class="games-grid" id="gameGrid">
        <!-- Карточки заполняются через JS -->
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <span>© 2026 GameHub — только безопасные .rbxl файлы</span>
        <span>⬇️ Все игры проверены на вирусы</span>
    </div>

</div>

<script>
    // Список игр (добавляй свои файлы в папку /games/)
    const games = [
        {
            id: 1,
            title: "Приключение в лесу",
            genre: "rpg",
            size: "420 МБ",
            downloads: "1.2K",
            file: "games/game1.rbxl",
            thumb: "🌲"
        },
        {
            id: 2,
            title: "Городской боевик",
            genre: "shooter",
            size: "680 МБ",
            downloads: "3.4K",
            file: "games/game2.rbxl",
            thumb: "🔫"
        },
        {
            id: 3,
            title: "Ферма онлайн",
            genre: "simulator",
            size: "310 МБ",
            downloads: "856",
            file: "games/game3.rbxl",
            thumb: "🌾"
        },
        {
            id: 4,
            title: "Заброшенный особняк",
            genre: "horror",
            size: "550 МБ",
            downloads: "2.1K",
            file: "games/game4.rbxl",
            thumb: "👻"
        },
        {
            id: 5,
            title: "Королевство драконов",
            genre: "rpg",
            size: "1.2 ГБ",
            downloads: "5.7K",
            file: "games/game5.rbxl",
            thumb: "🐉"
        },
        {
            id: 6,
            title: "Кибер-арена",
            genre: "shooter",
            size: "890 МБ",
            downloads: "4.2K",
            file: "games/game6.rbxl",
            thumb: "🤖"
        }
    ];

    let currentFilter = 'all';
    let currentSearch = '';

    function renderGames() {
        const grid = document.getElementById('gameGrid');
        const filtered = games.filter(g => {
            const matchGenre = currentFilter === 'all' || g.genre === currentFilter;
            const matchSearch = g.title.toLowerCase().includes(currentSearch.toLowerCase());
            return matchGenre && matchSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; color:#666; padding:60px 0;">
                    🔍 Ничего не найдено<br>
                    <span style="font-size:14px;">Попробуйте изменить фильтр или поиск</span>
                </div>
            `;
            return;
        }

        grid.innerHTML = filtered.map(g => `
            <div class="game-card" data-genre="${g.genre}">
                <div class="game-thumb">${g.thumb}</div>
                <div class="game-title">${g.title}</div>
                <div class="game-meta">
                    <span>📦 ${g.size}</span>
                    <span>⬇️ ${g.downloads}</span>
                </div>
                <a href="${g.file}" download class="btn-download">
                    ⬇️ Скачать .rbxl
                </a>
            </div>
        `).join('');
    }

    function filterGames(genre) {
        currentFilter = genre;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderGames();
    }

    function searchGames() {
        currentSearch = document.getElementById('searchInput').value;
        renderGames();
    }

    // Первый рендер
    renderGames();
</script>

</body>
</html>
